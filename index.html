<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全星曜紫微斗数（含性别及三方四正互动导出）</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f2f2f7;
            padding: 15px;
            color: #1c1c1e;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 12px; font-size: 20px; }
        
        .form-container {
            background: #ffffff;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 950px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-group { display: flex; align-items: center; gap: 6px; font-size: 14px; }
        input, select, button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-calc { background: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-calc:hover { background: #0056b3; }
        .btn-copy { background: #34c759; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-copy:hover { background: #248a3d; }

        .board-container {
            width: 100%;
            max-width: 980px;
            aspect-ratio: 1/1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 4px;
            background: #8e8e93;
            border: 2px solid #636366;
            border-radius: 10px;
            overflow: hidden;
        }
        .cell {
            background: #fff;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 11px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .cell:hover { background: #f0f0f5; }
        
        .cell.active-target { background: #ffe5e5; border-color: #ff3b30; }
        .cell.active-duigong { background: #e5f0ff; border-color: #007aff; }
        .cell-active-sanfang { background: #f0f9ff; border-color: #34c759; }

        .center-cell {
            grid-column: 2 / 4;
            grid-row: 2 / 4;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            text-align: center;
            overflow-y: auto;
        }
        .center-info { line-height: 1.6; font-size: 12px; width: 100%; text-align: left; }
        .center-info h2 { font-size: 16px; color: #007aff; margin-bottom: 6px; text-align: center; }

        .cell-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 3px;
            font-size: 11px;
            color: #8e8e93;
        }
        .daxian-tag { color: #ff9500; font-weight: bold; font-size: 11px; }

        .stars-section {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 4px;
            flex-grow: 1;
        }
        
        .star-row { display: flex; flex-wrap: wrap; gap: 3px; }
        .star-main { color: #d70015; font-weight: bold; font-size: 12px; }
        .star-good { color: #007aff; font-weight: 500; font-size: 11px; }
        .star-bad { color: #af52de; font-weight: 500; font-size: 11px; }
        .star-other { color: #34c759; font-size: 11px; }
        .star-sihua { color: #fff; background: #ff3b30; padding: 0 2px; border-radius: 2px; font-size: 9px; margin-left: 2px; }

        .cell-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
            border-top: 1px solid #f0f0f0;
            padding-top: 3px;
        }
        .palace-name { font-size: 13px; font-weight: bold; background: #e5e5ea; padding: 1px 5px; border-radius: 3px; }
        .ganzhi { font-size: 11px; color: #666; font-weight: 500; }
    </style>
</head>
<body>

    <h1>紫微斗数全星曜排盘（含三方四正互动）</h1>

    <div class="form-container">
        <div class="form-group">
            <label>公历生日：</label>
            <input type="date" id="birthDate">
        </div>
        <div class="form-group">
            <label>时辰：</label>
            <select id="birthTime">
                <option value="0">子时 (23:00-01:00)</option>
                <option value="1">丑时 (01:00-03:00)</option>
                <option value="2">寅时 (03:00-05:00)</option>
                <option value="3">卯时 (05:00-07:00)</option>
                <option value="4">辰时 (07:00-09:00)</option>
                <option value="5">巳时 (09:00-11:00)</option>
                <option value="6">午时 (11:00-13:00)</option>
                <option value="7">未时 (13:00-15:00)</option>
                <option value="8">申时 (15:00-17:00)</option>
                <option value="9">酉时 (17:00-19:00)</option>
                <option value="10">戌时 (19:00-21:00)</option>
                <option value="11">亥时 (21:00-23:00)</option>
            </select>
        </div>
        <div class="form-group">
            <label>性别：</label>
            <select id="gender">
                <option value="1">男（乾造）</option>
                <option value="0">女（坤造）</option>
            </select>
        </div>
        <button class="btn-calc" onclick="calculateZiwei()">生成排盘</button>
        <button class="btn-copy" onclick="copyFullBoard()">📋 复制带三方四正文本命盘</button>
    </div>

    <div class="board-container">
        <div class="cell" id="cell-5" onclick="highlightSanfang(5)"></div>
        <div class="cell" id="cell-6" onclick="highlightSanfang(6)"></div>
        <div class="cell" id="cell-7" onclick="highlightSanfang(7)"></div>
        <div class="cell" id="cell-8" onclick="highlightSanfang(8)"></div>
        
        <div class="cell" id="cell-4" onclick="highlightSanfang(4)"></div>
        <div class="center-cell">
            <div class="center-info" id="centerInfo">
                <h2>命盘摘要</h2>
                <p style="text-align:center;">请选择出生日期与性别后生成<br><small style="color:#8e8e93;">生成后点击任意宫位可查看【三方四正互动】</small></p>
            </div>
        </div>
        <div class="cell" id="cell-9" onclick="highlightSanfang(9)"></div>

        <div class="cell" id="cell-3" onclick="highlightSanfang(3)"></div>
        <div class="cell" id="cell-10" onclick="highlightSanfang(10)"></div>

        <div class="cell" id="cell-2" onclick="highlightSanfang(2)"></div>
        <div class="cell" id="cell-1" onclick="highlightSanfang(1)"></div>
        <div class="cell" id="cell-0" onclick="highlightSanfang(0)"></div>
        <div class="cell" id="cell-11" onclick="highlightSanfang(11)"></div>
    </div>

    <script>
        const ZHI = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
        const GAN = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
        const PALACES = ["命宫", "兄弟宫", "夫妻宫", "子女宫", "财帛宫", "疾厄宫", "迁移宫", "仆役宫", "官禄宫", "田宅宫", "福德宫", "父母宫"];
        const JU_NAMES = { 2: "水二局", 3: "木三局", 4: "金四局", 5: "土五局", 6: "火六局" };

        const SIHUA = {
            "甲": { "廉贞": "禄", "破军": "权", "武曲": "科", "太阳": "忌" },
            "乙": { "天机": "禄", "天梁": "权", "紫微": "科", "太阴": "忌" },
            "丙": { "天同": "禄", "天机": "权", "文昌": "科", "廉贞": "忌" },
            "丁": { "太阴": "禄", "天同": "权", "天机": "科", "巨门": "忌" },
            "戊": { "贪狼": "禄", "太阴": "权", "右弼": "科", "天机": "忌" },
            "己": { "武曲": "禄", "贪狼": "权", "天梁": "科", "文曲": "忌" },
            "庚": { "太阳": "禄", "武曲": "权", "太阴": "科", "天同": "忌" },
            "辛": { "巨门": "禄", "太阳": "权", "文曲": "科", "文昌": "忌" },
            "壬": { "天梁": "禄", "紫微": "权", "左辅": "科", "武曲": "忌" },
            "癸": { "破军": "禄", "巨门": "权", "太阴": "科", "贪狼": "忌" }
        };

        let currentBoardData = null;

        function getJuNumber(stem, branch) {
            const map = {
                "甲子":4,"乙丑":4,"丙寅":2,"丁卯":2,"戊辰":5,"己巳":5,"庚午":3,"辛未":3,"壬申":6,"癸酉":6,
                "甲戌":4,"乙亥":4,"丙子":2,"丁丑":2,"戊寅":5,"己卯":5,"庚辰":3,"辛巳":3,"壬午":6,"癸未":6,
                "甲申":2,"乙酉":2,"丙戌":5,"丁亥":5,"戊子":3,"己丑":3,"庚寅":6,"辛卯":6,"壬辰":4,"癸巳":4,
                "甲午":2,"乙未":2,"丙申":5,"丁酉":5,"戊戌":3,"己亥":3,"庚子":6,"辛丑":6,"壬寅":4,"癸卯":4,
                "甲辰":3,"乙巳":3,"丙午":6,"丁未":6,"戊申":4,"己酉":4,"庚戌":2,"辛亥":2,"壬子":5,"癸丑":5,
                "甲寅":3,"乙卯":3,"丙辰":6,"丁巳":6,"戊午":4,"己未":4,"庚申":2,"辛酉":2,"壬戌":5,"癸亥":5
            };
            return map[stem + branch] || 5;
        }

        function getZiweiIndex(ju, day) {
            let remainder = day % ju;
            let quotient = Math.floor(day / ju);
            let offset = 0;

            if (remainder === 0) {
                offset = quotient;
            } else {
                let add = ju - remainder;
                if (add % 2 === 1) { offset = quotient + 1 - add; } 
                else { offset = quotient + 1 + add; }
            }
            return (2 + (offset - 1) % 12 + 12) % 12;
        }

        function calculateZiwei() {
            const dateStr = document.getElementById("birthDate").value;
            if (!dateStr) return alert("请先选择您的公历生日！");

            const timeIdx = parseInt(document.getElementById("birthTime").value);
            const gender = parseInt(document.getElementById("gender").value);
            const [y, m, d] = dateStr.split("-").map(Number);

            const solar = Solar.fromYmd(y, m, d);
            const lunar = solar.getLunar();

            const lunarMonth = Math.abs(lunar.getMonth());
            const lunarDay = lunar.getDay();
            const yearGan = lunar.getYearGan();
            const yearZhi = lunar.getYearZhi();

            let mingIdx = (2 + (lunarMonth - 1) - timeIdx + 12) % 12;
            let shenIdx = (2 + (lunarMonth - 1) + timeIdx) % 12;

            const yearGanIdx = GAN.indexOf(yearGan);
            const yearZhiIdx = ZHI.indexOf(yearZhi);

            const isYangGan = (yearGanIdx % 2 === 0);
            const isForwardDaxian = (isYangGan && gender === 1) || (!isYangGan && gender === 0);
            const genderTitle = (isYangGan ? "阳" : "阴") + (gender === 1 ? "男" : "女");

            const yinStemIdx = (yearGanIdx % 5) * 2 + 2;
            let stems = [];
            for (let i = 0; i < 12; i++) {
                stems[i] = GAN[(yinStemIdx + (i - 2 + 12)) % 10];
            }

            const ju = getJuNumber(stems[mingIdx], ZHI[mingIdx]);
            const ziweiIdx = getZiweiIndex(ju, lunarDay);
            const tianfuIdx = (4 - ziweiIdx + 12) % 12;

            let mains = Array.from({ length: 12 }, () => []);
            let goods = Array.from({ length: 12 }, () => []);
            let bads = Array.from({ length: 12 }, () => []);
            let others = Array.from({ length: 12 }, () => []);

            const ziweiGroup = [
                { name: "紫微", offset: 0 }, { name: "天机", offset: -1 },
                { name: "太阳", offset: -3 }, { name: "武曲", offset: -4 },
                { name: "天同", offset: -5 }, { name: "廉贞", offset: -8 }
            ];
            ziweiGroup.forEach(s => mains[(ziweiIdx + s.offset + 24) % 12].push(s.name));

            const tianfuGroup = [
                { name: "天府", offset: 0 }, { name: "太阴", offset: 1 },
                { name: "贪狼", offset: 2 }, { name: "巨门", offset: 3 },
                { name: "天相", offset: 4 }, { name: "天梁", offset: 5 },
                { name: "七杀", offset: 6 }, { name: "破军", offset: 10 }
            ];
            tianfuGroup.forEach(s => mains[(tianfuIdx + s.offset) % 12].push(s.name));

            goods[(10 + timeIdx) % 12].push("文昌");
            goods[(4 - timeIdx + 12) % 12].push("文曲");
            goods[(4 + (lunarMonth - 1)) % 12].push("左辅");
            goods[(10 - (lunarMonth - 1) + 12) % 12].push("右弼");
            
            const kuiYueMap = { "甲":[1,7], "乙":[0,8], "丙":[11,9], "丁":[11,9], "戊":[1,7], "己":[0,8], "庚":[1,7], "辛":[6,2], "壬":[3,5], "癸":[3,5] };
            if (kuiYueMap[yearGan]) {
                goods[kuiYueMap[yearGan][0]].push("天魁");
                goods[kuiYueMap[yearGan][1]].push("天钺");
            }

            bads[(11 - timeIdx + 12) % 12].push("地空");
            bads[(11 + timeIdx) % 12].push("地劫");

            const luMap = { "甲":2, "乙":3, "丙":5, "丁":6, "戊":5, "己":6, "庚":8, "辛":9, "壬":11, "癸":0 };
            let luIdx = luMap[yearGan];
            if (luIdx !== undefined) {
                bads[(luIdx + 1) % 12].push("擎羊");
                bads[(luIdx - 1 + 12) % 12].push("陀罗");
                others[luIdx].push("禄存");
            }

            let huoxingStart = [2, 3, 1, 9][yearZhiIdx % 4];
            bads[(huoxingStart + timeIdx) % 12].push("火星");
            bads[(10 + timeIdx) % 12].push("铃星");

            let tianmaMap = { "申":2, "子":2, "辰":2, "寅":8, "午":8, "戌":8, "亥":5, "卯":5, "未":5, "巳":11, "酉":11, "丑":11 };
            if (tianmaMap[yearZhi]) others[tianmaMap[yearZhi]].push("天马");

            let hongluanIdx = (3 - yearZhiIdx + 12) % 12;
            others[hongluanIdx].push("红鸾");
            others[(hongluanIdx + 6) % 12].push("天喜");

            const yearSihua = SIHUA[yearGan] || {};

            document.getElementById("centerInfo").innerHTML = `
                <h2>命盘摘要</h2>
                <p><b>公历：</b>${y}年${m}月${d}日</p>
                <p><b>农历：</b>${lunar.getYearInGanZhi()}年 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()} ${ZHI[timeIdx]}时</p>
                <p><b>造化：</b>${genderTitle} | <b>命局：</b>${JU_NAMES[ju]}</p>
                <p><b>命宫：</b>${ZHI[mingIdx]}宫 | <b>身宫：</b>${ZHI[shenIdx]}宫</p>
                <p style="color:#007aff;margin-top:6px;">👉 点击外围任意宫位查看三方四正互动</p>
            `;

            currentBoardData = {
                solar: `${y}年${m}月${d}日`,
                lunar: `${lunar.getYearInGanZhi()}年 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()} ${ZHI[timeIdx]}时`,
                genderTitle: genderTitle,
                ju: JU_NAMES[ju],
                ming: ZHI[mingIdx],
                shen: ZHI[shenIdx],
                daxianDir: isForwardDaxian ? '顺行' : '逆行',
                palaces: []
            };

            for (let i = 0; i < 12; i++) {
                const cellEl = document.getElementById(`cell-${i}`);
                cellEl.className = "cell";
                let pNameIdx = (mingIdx - i + 12) % 12;
                let palaceName = PALACES[pNameIdx];
                if (i === shenIdx) palaceName += " (身)";

                let daxianStep = isForwardDaxian ? (i - mingIdx + 12) % 12 : (mingIdx - i + 12) % 12;
                let daxianStart = ju + daxianStep * 10;
                let daxianEnd = daxianStart + 9;

                let mStars = mains[i].map(s => {
                    let sh = yearSihua[s] ? `<span class="star-sihua">化${yearSihua[s]}</span>` : '';
                    return `<span class="star-main">${s}${sh}</span>`;
                }).join(' ');

                let gStars = goods[i].map(s => {
                    let sh = yearSihua[s] ? `<span class="star-sihua">化${yearSihua[s]}</span>` : '';
                    return `<span class="star-good">${s}${sh}</span>`;
                }).join(' ');

                let bStars = bads[i].map(s => `<span class="star-bad">${s}</span>`).join(' ');
                let oStars = others[i].map(s => `<span class="star-other">${s}</span>`).join(' ');

                cellEl.innerHTML = `
                    <div class="cell-header">
                        <span>${stems[i]}${ZHI[i]}</span>
                        <span class="daxian-tag">${daxianStart}-${daxianEnd}岁</span>
                    </div>
                    <div class="stars-section">
                        <div class="star-row">${mStars || '<span style="color:#ccc;">无主星</span>'}</div>
                        <div class="star-row">${gStars}</div>
                        <div class="star-row">${bStars}</div>
                        <div class="star-row">${oStars}</div>
                    </div>
                    <div class="cell-footer">
                        <span class="ganzhi">${stems[i]}</span>
                        <span class="palace-name">${palaceName}</span>
                    </div>
                `;

                currentBoardData.palaces.push({
                    zhiIdx: i,
                    zhi: ZHI[i],
                    stem: stems[i],
                    name: palaceName,
                    daxian: `${daxianStart}-${daxianEnd}岁`,
                    mains: mains[i].map(s => s + (yearSihua[s] ? `(化${yearSihua[s]})` : '')),
                    goods: goods[i].map(s => s + (yearSihua[s] ? `(化${yearSihua[s]})` : '')),
                    bads: bads[i],
                    others: others[i]
                });
            }
        }

        function highlightSanfang(targetIdx) {
            if (!currentBoardData) return;

            for (let i = 0; i < 12; i++) {
                document.getElementById(`cell-${i}`).className = "cell";
            }

            let duigongIdx = (targetIdx + 6) % 12;
            let sanfang1Idx = (targetIdx + 4) % 12;
            let sanfang2Idx = (targetIdx + 8) % 12;

            document.getElementById(`cell-${targetIdx}`).classList.add("active-target");
            document.getElementById(`cell-${duigongIdx}`).classList.add("active-duigong");
            document.getElementById(`cell-${sanfang1Idx}`).classList.add("cell-active-sanfang");
            document.getElementById(`cell-${sanfang2Idx}`).classList.add("cell-active-sanfang");

            let targetPalace = currentBoardData.palaces[targetIdx];
            let duigongPalace = currentBoardData.palaces[duigongIdx];
            let s1Palace = currentBoardData.palaces[sanfang1Idx];
            let s2Palace = currentBoardData.palaces[sanfang2Idx];

            let stem = targetPalace.stem;
            let flySihua = SIHUA[stem] || {};
            let flyText = Object.entries(flySihua).map(([s, h]) => `${s}化${h}`).join("、");

            document.getElementById("centerInfo").innerHTML = `
                <h2>【${targetPalace.name}】三方四正互动</h2>
                <p><b>目标宫位：</b><span style="color:#d70015;font-weight:bold;">${targetPalace.name} (${targetPalace.stem}${targetPalace.zhi})</span></p>
                <p><b>对宫 (拱照)：</b>${duigongPalace.name} (${duigongPalace.zhi})</p>
                <p><b>三方 (会照)：</b>${s1Palace.name} (${s1Palace.zhi})、${s2Palace.name} (${s2Palace.zhi})</p>
                <hr style="margin:6px 0;border:none;border-top:1px dashed #ccc;">
                <p><b>宫干自飞四化：</b>${targetPalace.stem}干令 ${flyText}</p>
                <p style="font-size:11px;color:#666;margin-top:4px;">💡 红框为本宫，蓝框为对宫，绿框为三方相会宫位。</p>
            `;
        }

        // 🌟 导出文本时，明确写出性别造化、大运方向以及三方四正的星曜明细
        function copyFullBoard() {
            if (!currentBoardData) return alert("请先选择生日与性别，并生成排盘！");

            let txt = `【紫微斗数全星曜纯文本命盘】\n`;
            txt += `公历生日：${currentBoardData.solar}\n`;
            txt += `农历生辰：${currentBoardData.lunar}\n`;
            txt += `阴阳造化：${currentBoardData.genderTitle} | 大运：${currentBoardData.daxianDir}\n`;
            txt += `命局：${currentBoardData.ju} | 命宫：${currentBoardData.ming}宫 | 身宫：${currentBoardData.shen}宫\n`;
            txt += `==================================================\n\n`;

            currentBoardData.palaces.forEach(p => {
                let idx = p.zhiIdx;
                let duigong = currentBoardData.palaces[(idx + 6) % 12];
                let sf1 = currentBoardData.palaces[(idx + 4) % 12];
                let sf2 = currentBoardData.palaces[(idx + 8) % 12];

                let getStarsStr = (pal) => {
                    let all = [...pal.mains, ...pal.goods, ...pal.bads, ...pal.others];
                    return all.length > 0 ? all.join("、") : "无主要星曜";
                };

                let flySihua = SIHUA[p.stem] || {};
                let flyText = Object.entries(flySihua).map(([s, h]) => `${s}化${h}`).join("、");

                txt += `【${p.zhi}宫 - ${p.name}】 (${p.stem}${p.zhi})  [大限: ${p.daxian}]\n`;
                txt += `  本宫主星：${p.mains.join("、") || "无主星"}\n`;
                txt += `  本宫吉星：${p.goods.join("、") || "无"}\n`;
                txt += `  本宫煞星：${p.bads.join("、") || "无"}\n`;
                txt += `  本宫杂曜：${p.others.join("、") || "无"}\n`;
                txt += `  --------------------------------------------------\n`;
                txt += `  🔗 互动·对宫【${duigong.name}(${duigong.zhi})】：${getStarsStr(duigong)}\n`;
                txt += `  🔗 互动·三方【${sf1.name}(${sf1.zhi})】：${getStarsStr(sf1)}\n`;
                txt += `  🔗 互动·三方【${sf2.name}(${sf2.zhi})】：${getStarsStr(sf2)}\n`;
                txt += `  ✨ 宫干飞星：${p.stem}干使 ${flyText}\n\n`;
            });

            navigator.clipboard.writeText(txt).then(() => {
                alert("已成功复制【含性别与三方四正互动】的纯文本命盘！");
            });
        }
    </script>
